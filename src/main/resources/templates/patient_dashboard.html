<!DOCTYPE html>
<html>
<head>
    <title>Patient Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .patient-selector {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .patient-selector label {
            font-weight: 600;
            margin-right: 15px;
        }

        .patient-selector select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            min-width: 260px;
            margin-right: 15px;
            font-size: 1em;
            background: white;
        }

        .button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .button:hover {
            opacity: 0.9;
        }

        .button.cancel {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            padding: 6px 15px;
            font-size: 0.9em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #4CAF50;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .no-appointments {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4CAF50;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👤 Patient Dashboard</h1>
    <p class="subtitle">View and manage your appointments</p>

    <div class="patient-selector">
        <label for="patient-select">Who are you?</label>
        <select id="patient-select">
            <option value="">— Select your name —</option>
        </select>
        <button class="button" onclick="loadAppointments()">Load My Appointments</button>
    </div>

    <div id="error-message" class="error"></div>
    <div id="success-message" class="success"></div>
    <div id="loading" class="loading" style="display: none;">Loading appointments...</div>
    <div id="appointments-container"></div>

    <a href="/" class="back-link">← Return Home</a>
</div>

<script>
    async function populatePatientDropdown() {
        try {
            const response = await fetch('/api/patients');
            const patients = await response.json();
            const select = document.getElementById('patient-select');
            patients.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.username} (${p.email})`;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error('Could not load patient list', e);
        }
    }

    async function loadAppointments() {
        const patientId = document.getElementById('patient-select').value;

        if (!patientId) {
            showError('Please select your name from the list');
            return;
        }

        const loading = document.getElementById('loading');
        const container = document.getElementById('appointments-container');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');

        loading.style.display = 'block';
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        container.innerHTML = '';

        try {
            const response = await fetch(`/api/patients/${patientId}/appointments`);

            if (!response.ok) {
                throw new Error('Failed to fetch appointments');
            }

            const appointments = await response.json();
            displayAppointments(appointments, patientId);
        } catch (error) {
            showError('Unable to load appointments. Please try again.');
            console.error('Error:', error);
        } finally {
            loading.style.display = 'none';
        }
    }

    function displayAppointments(appointments, patientId) {
        const container = document.getElementById('appointments-container');

        if (appointments.length === 0) {
            container.innerHTML = '<div class="no-appointments">You have no scheduled appointments.</div>';
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Provider</th>
                        <th>Specialty</th>
                        <th>Service</th>
                        <th>Date & Time</th>
                        <th>Duration</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
        `;

        appointments.forEach(appointment => {
            const providerLabel = appointment.providerUsername || `Provider ${appointment.providerId}`;
            const specialtyLabel = appointment.providerSpecialty || '';
            const serviceLabel = appointment.serviceName || `Service ${appointment.serviceId}`;
            const dateLabel = appointment.startTime ? formatDateTime(new Date(appointment.startTime)) : 'N/A';
            const duration = appointment.durationMinutes ? `${appointment.durationMinutes} min` : '';

            html += `
                <tr>
                    <td>${providerLabel}</td>
                    <td>${specialtyLabel}</td>
                    <td>${serviceLabel}</td>
                    <td>${dateLabel}</td>
                    <td>${duration}</td>
                    <td>
                        <button class="button cancel" onclick="cancelAppointment(${appointment.id}, ${patientId})">
                            Cancel
                        </button>
                    </td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;

        container.innerHTML = html;
    }

    function formatDateTime(date) {
        return date.toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    async function cancelAppointment(appointmentId, patientId) {
        if (!confirm('Are you sure you want to cancel this appointment?')) {
            return;
        }

        try {
            const response = await fetch(`/api/patients/${patientId}/appointments/${appointmentId}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('Appointment cancelled successfully!');
                // Reload appointments
                setTimeout(() => loadAppointments(), 1500);
            } else {
                showError(data.error || 'Failed to cancel appointment');
            }
        } catch (error) {
            showError('Network error. Please try again.');
            console.error('Error:', error);
        }
    }

    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSuccess(message) {
        const successDiv = document.getElementById('success-message');
        successDiv.textContent = message;
        successDiv.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('DOMContentLoaded', populatePatientDropdown);
</script>

</body>
</html>
