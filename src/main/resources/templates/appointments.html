<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments</title>
</head>
<body>

<h1>Appointments</h1>

<table border="1">
    <tr>
        <th>Appointment Time</th>
    </tr>

    <tr th:each="appointment : ${appointments}">
        <td th:text="${appointment.appointmentTime}"></td>
    </tr>

</table>

<a href="/">Back to Home</a>

</body>
</html>
