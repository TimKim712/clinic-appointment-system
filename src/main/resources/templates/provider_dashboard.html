<!DOCTYPE html>
<html>
<head>
    <title>Provider Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #2196F3;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .provider-selector {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .provider-selector label {
            font-weight: 600;
            margin-right: 15px;
        }

        .provider-selector select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            min-width: 260px;
            margin-right: 15px;
            font-size: 1em;
            background: white;
        }

        .button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .button:hover {
            opacity: 0.9;
        }

        .button.create {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            margin-left: 10px;
        }

        .button.delete {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            padding: 6px 15px;
            font-size: 0.9em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #2196F3;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .no-appointments {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2196F3;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .create-form {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: none;
        }

        .create-form h3 {
            color: #1976D2;
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            background: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚕️ Provider Dashboard</h1>
    <p class="subtitle">Manage your appointments with admin privileges</p>

    <div class="provider-selector">
        <label for="provider-select">Who are you?</label>
        <select id="provider-select">
            <option value="">— Select your name —</option>
        </select>
        <button class="button" onclick="loadAppointments()">Load My Appointments</button>
        <button class="button create" onclick="toggleCreateForm()">Create New Appointment</button>
    </div>

    <!-- Create Appointment Form -->
    <div id="create-form" class="create-form">
        <h3>Create New Appointment</h3>
        <form onsubmit="createAppointment(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="new-patient-select">Patient *</label>
                    <select id="new-patient-select" required>
                        <option value="">— Select patient —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-slot-select">Available Slot *</label>
                    <select id="new-slot-select" required>
                        <option value="">— Select slot —</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="button">Create Appointment</button>
            <button type="button" class="button delete" onclick="toggleCreateForm()">Cancel</button>
        </form>
    </div>

    <div id="error-message" class="error"></div>
    <div id="success-message" class="success"></div>
    <div id="loading" class="loading" style="display: none;">Loading appointments...</div>
    <div id="appointments-container"></div>

    <a href="/" class="back-link">← Return Home</a>
</div>

<script>
    function formatDateTime(date) {
        return date.toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    async function populateDropdowns() {
        const [provRes, patRes, slotRes] = await Promise.all([
            fetch('/api/providers'),
            fetch('/api/patients'),
            fetch('/api/appointments/slots/available')
        ]);

        const providers = await provRes.json();
        const patients  = await patRes.json();
        const slots     = await slotRes.json();

        const provSelect = document.getElementById('provider-select');
        providers.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `${p.username} — ${p.specialty}`;
            provSelect.appendChild(opt);
        });

        const patSelect = document.getElementById('new-patient-select');
        patients.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `${p.username} (${p.email})`;
            patSelect.appendChild(opt);
        });

        const slotSelect = document.getElementById('new-slot-select');
        slots.forEach(s => {
            const opt = document.createElement('option');
            opt.value = JSON.stringify({ slotId: s.id, serviceId: s.serviceId });
            opt.textContent = `${s.serviceName} — ${formatDateTime(new Date(s.startTime))} (${s.durationMinutes} min)`;
            slotSelect.appendChild(opt);
        });
    }

    function toggleCreateForm() {
        const form = document.getElementById('create-form');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function loadAppointments() {
        const providerId = document.getElementById('provider-select').value;

        if (!providerId) {
            showError('Please select your name from the list');
            return;
        }

        const loading   = document.getElementById('loading');
        const container = document.getElementById('appointments-container');
        const errorDiv  = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');

        loading.style.display = 'block';
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        container.innerHTML = '';

        try {
            const response = await fetch(`/api/providers/${providerId}/appointments`);
            if (!response.ok) throw new Error('Failed to fetch appointments');
            const appointments = await response.json();
            displayAppointments(appointments, providerId);
        } catch (error) {
            showError('Unable to load appointments. Please try again.');
            console.error('Error:', error);
        } finally {
            loading.style.display = 'none';
        }
    }

    function displayAppointments(appointments, providerId) {
        const container = document.getElementById('appointments-container');

        if (appointments.length === 0) {
            container.innerHTML = '<div class="no-appointments">You have no appointments scheduled.</div>';
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Patient</th>
                        <th>Service</th>
                        <th>Date & Time</th>
                        <th>Duration</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
        `;

        appointments.forEach(appointment => {
            const patientLabel = appointment.patientUsername || `Patient ${appointment.patientId}`;
            const serviceLabel = appointment.serviceName     || `Service ${appointment.serviceId}`;
            const dateLabel    = appointment.startTime ? formatDateTime(new Date(appointment.startTime)) : 'N/A';
            const duration     = appointment.durationMinutes ? `${appointment.durationMinutes} min` : '';

            html += `
                <tr>
                    <td>${patientLabel}</td>
                    <td>${serviceLabel}</td>
                    <td>${dateLabel}</td>
                    <td>${duration}</td>
                    <td>
                        <button class="button delete" onclick="deleteAppointment(${appointment.id}, ${providerId})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    async function createAppointment(event) {
        event.preventDefault();

        const providerId = document.getElementById('provider-select').value;
        const patientId  = document.getElementById('new-patient-select').value;
        const slotRaw    = document.getElementById('new-slot-select').value;

        if (!providerId) { showError('Please select yourself as provider first'); return; }
        if (!patientId)  { showError('Please select a patient'); return; }
        if (!slotRaw)    { showError('Please select an available slot'); return; }

        const { slotId, serviceId } = JSON.parse(slotRaw);

        const appointmentData = {
            patientId:  parseInt(patientId),
            providerId: parseInt(providerId),
            serviceId:  serviceId,
            slotId:     slotId
        };

        try {
            const response = await fetch(`/api/providers/${providerId}/appointments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(appointmentData)
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess(`Appointment created for ${document.getElementById('new-patient-select').selectedOptions[0].text}!`);
                toggleCreateForm();
                document.getElementById('create-form').querySelector('form').reset();
                // Refresh slot dropdown to remove the now-booked slot
                document.getElementById('new-slot-select').innerHTML = '<option value="">— Select slot —</option>';
                const slotRes = await fetch('/api/appointments/slots/available');
                const slots   = await slotRes.json();
                const slotSel = document.getElementById('new-slot-select');
                slots.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({ slotId: s.id, serviceId: s.serviceId });
                    opt.textContent = `${s.serviceName} — ${formatDateTime(new Date(s.startTime))} (${s.durationMinutes} min)`;
                    slotSel.appendChild(opt);
                });
                setTimeout(() => loadAppointments(), 1500);
            } else {
                showError(data.error || 'Failed to create appointment');
            }
        } catch (error) {
            showError('Network error. Please try again.');
            console.error('Error:', error);
        }
    }

    async function deleteAppointment(appointmentId, providerId) {
        if (!confirm('Are you sure you want to delete this appointment?')) return;

        try {
            const response = await fetch(`/api/providers/${providerId}/appointments/${appointmentId}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('Appointment deleted successfully!');
                setTimeout(() => loadAppointments(), 1500);
            } else {
                showError(data.error || 'Failed to delete appointment');
            }
        } catch (error) {
            showError('Network error. Please try again.');
            console.error('Error:', error);
        }
    }

    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSuccess(message) {
        const successDiv = document.getElementById('success-message');
        successDiv.textContent = message;
        successDiv.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('DOMContentLoaded', populateDropdowns);
</script>

</body>
</html>
