<!DOCTYPE html>
<html>
<head>
    <title>Appointment Details</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 { color: #d32f2f; margin-bottom: 10px; }

        .subtitle { color: #666; margin-bottom: 30px; }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .search-bar input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 200px;
            font-size: 1em;
        }

        .button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .button:hover { opacity: 0.9; }

        .detail-card {
            background: #fff8f8;
            border: 1px solid #ffcdd2;
            border-radius: 10px;
            padding: 25px;
            display: none;
        }

        .detail-card h2 {
            color: #d32f2f;
            margin-bottom: 20px;
            font-size: 1.4em;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-item label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .detail-item span {
            display: block;
            color: #333;
            font-size: 1em;
        }

        .section-divider {
            border: none;
            border-top: 1px solid #ffcdd2;
            margin: 20px 0;
        }

        .section-title {
            color: #d32f2f;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .loading { text-align: center; padding: 40px; color: #d32f2f; display: none; }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d32f2f;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover { text-decoration: underline; }

        .nav-links { display: flex; gap: 15px; margin-bottom: 20px; }

        .button.secondary {
            background: linear-gradient(135deg, #607D8B 0%, #455A64 100%);
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Appointment Details</h1>
    <p class="subtitle">View full details for a specific appointment</p>

    <div class="nav-links">
        <a href="/admin-dashboard" class="button secondary">All Appointments</a>
        <a href="/admin-stats" class="button secondary">System Statistics</a>
    </div>

    <div class="search-bar">
        <input type="number" id="appointment-id" placeholder="Enter Appointment ID">
        <button class="button" onclick="loadDetails()">Lookup</button>
    </div>

    <div id="error-message" class="error"></div>
    <div id="loading" class="loading">Loading details...</div>

    <div id="detail-card" class="detail-card">
        <h2>Appointment #<span id="detail-id"></span></h2>

        <p class="section-title">Patient Information</p>
        <div class="detail-grid">
            <div class="detail-item">
                <label>Name</label>
                <span id="detail-patient-name"></span>
            </div>
            <div class="detail-item">
                <label>Email</label>
                <span id="detail-patient-email"></span>
            </div>
        </div>

        <hr class="section-divider">

        <p class="section-title">Provider Information</p>
        <div class="detail-grid">
            <div class="detail-item">
                <label>Name</label>
                <span id="detail-provider-name"></span>
            </div>
            <div class="detail-item">
                <label>Specialty</label>
                <span id="detail-provider-specialty"></span>
            </div>
        </div>

        <hr class="section-divider">

        <p class="section-title">Appointment Details</p>
        <div class="detail-grid">
            <div class="detail-item">
                <label>Service</label>
                <span id="detail-service-name"></span>
            </div>
            <div class="detail-item">
                <label>Duration</label>
                <span id="detail-duration"></span>
            </div>
            <div class="detail-item">
                <label>Date & Start Time</label>
                <span id="detail-start-time"></span>
            </div>
            <div class="detail-item">
                <label>End Time</label>
                <span id="detail-end-time"></span>
            </div>
        </div>
    </div>

    <a href="/" class="back-link">← Return Home</a>
</div>

<script>
    async function loadDetails() {
        const appointmentId = document.getElementById('appointment-id').value;

        if (!appointmentId) {
            showError('Please enter an appointment ID');
            return;
        }

        const loading = document.getElementById('loading');
        const card = document.getElementById('detail-card');
        const errorDiv = document.getElementById('error-message');

        loading.style.display = 'block';
        card.style.display = 'none';
        errorDiv.style.display = 'none';

        try {
            const response = await fetch(`/api/admin/appointments/${appointmentId}/details`);
            if (response.status === 404) {
                showError('Appointment not found. Please check the ID and try again.');
                return;
            }
            if (!response.ok) throw new Error('Failed to fetch details');

            const a = await response.json();
            populateCard(a);
        } catch (error) {
            showError('Unable to load appointment details. Please try again.');
        } finally {
            loading.style.display = 'none';
        }
    }

    function populateCard(a) {
        document.getElementById('detail-id').textContent = a.id;
        document.getElementById('detail-patient-name').textContent = a.patientUsername || `Patient ${a.patientId}`;
        document.getElementById('detail-patient-email').textContent = a.patientEmail || 'N/A';
        document.getElementById('detail-provider-name').textContent = a.providerUsername || `Provider ${a.providerId}`;
        document.getElementById('detail-provider-specialty').textContent = a.providerSpecialty || 'N/A';
        document.getElementById('detail-service-name').textContent = a.serviceName || `Service ${a.serviceId}`;
        document.getElementById('detail-duration').textContent = a.durationMinutes ? `${a.durationMinutes} minutes` : 'N/A';
        document.getElementById('detail-start-time').textContent = a.startTime ? formatDateTime(new Date(a.startTime)) : 'N/A';
        document.getElementById('detail-end-time').textContent = a.endTime ? formatDateTime(new Date(a.endTime)) : 'N/A';
        document.getElementById('detail-card').style.display = 'block';
    }

    function formatDateTime(date) {
        return date.toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
    }

    document.getElementById('appointment-id').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadDetails();
    });
</script>

</body>
</html>
