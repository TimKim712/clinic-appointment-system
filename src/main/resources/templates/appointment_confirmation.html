<!DOCTYPE html>
<html>
<head>
    <title>Appointment Confirmed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .checkmark {
            font-size: 4em;
            margin-bottom: 15px;
        }

        h1 {
            color: #4CAF50;
            font-size: 2em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .detail-card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 25px;
            text-align: left;
            margin-bottom: 30px;
        }

        .detail-card h2 {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95em;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-row .label {
            color: #888;
            font-weight: 600;
        }

        .detail-row .value {
            color: #333;
            text-align: right;
        }

        .notification-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .notification-badge.sent {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .notification-badge.failed {
            background: #fff3e0;
            color: #e65100;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .button {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95em;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .button:hover { transform: translateY(-2px); }

        .button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .button.secondary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .no-data {
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="checkmark">✅</div>
    <h1>Appointment Confirmed!</h1>
    <p class="subtitle">Your appointment has been successfully booked.</p>

    <div id="notification-status"></div>

    <div id="detail-card" class="detail-card">
        <h2>Appointment Details</h2>
        <div id="details-body"></div>
    </div>

    <div class="actions">
        <a href="/appointments" class="button primary">Book Another</a>
        <a href="/patient-dashboard" class="button secondary">My Appointments</a>
        <a href="/" class="button" style="background:#eee;color:#333;">Home</a>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        const raw = sessionStorage.getItem('appointmentData');
        sessionStorage.removeItem('appointmentData');

        if (!raw) {
            document.getElementById('detail-card').innerHTML =
                '<p class="no-data">No appointment data found. Please book via the slots page.</p>';
            return;
        }

        const a = JSON.parse(raw);

        function fmt(dt) {
            if (!dt) return 'N/A';
            return new Date(dt).toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long',
                day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        const rows = [
            ['Appointment ID', `#${a.id}`],
            ['Patient',        a.patientUsername  || `ID ${a.patientId}`],
            ['Patient Email',  a.patientEmail     || 'N/A'],
            ['Provider',       a.providerUsername || `ID ${a.providerId}`],
            ['Specialty',      a.providerSpecialty || 'N/A'],
            ['Service',        a.serviceName      || `ID ${a.serviceId}`],
            ['Duration',       a.durationMinutes  ? `${a.durationMinutes} minutes` : 'N/A'],
            ['Date & Time',    fmt(a.startTime)],
            ['End Time',       fmt(a.endTime)],
        ];

        document.getElementById('details-body').innerHTML = rows.map(([label, value]) => `
            <div class="detail-row">
                <span class="label">${label}</span>
                <span class="value">${value}</span>
            </div>
        `).join('');

        // Notification status is not returned by the API, so show a generic badge
        document.getElementById('notification-status').innerHTML =
            '<span class="notification-badge sent">📧 Confirmation notification sent</span>';
    });
</script>

</body>
</html>
